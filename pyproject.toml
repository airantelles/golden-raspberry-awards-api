[project]
name = "golden-raspberry-awards-api"
version = "0.1.0"
description = "API for Golden Raspberry Awards producer intervals."
requires-python = "==3.13.15"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "sqlalchemy==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.uv]
required-version = "==0.12.15"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
